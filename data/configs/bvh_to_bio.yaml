# BVH (CMU MoCap) -> BIO 骨架重定向配置
#
# 尺度来源: data/scripts/audit_skeleton_scale.py 实测 (代表段 008/08_01.bvh)
#   长骨段(大腿/小腿/上臂/前臂)比例 BIO(m) / BVH(cm) 高度一致:
#     mean=0.060, median=0.061, CV=0.088  -> 主体是全局缩放 (MIXED 分类)
#   偏离段 (躯干连接/颈/手) 属局部形态差异, 对行走影响小。
#
# source_length_scale 语义: 源距离(cm 数值) × source_length_scale = 目标距离(m)
#   = cm->m (0.01) × 骨架放大 (~6x) 的复合因子。
#   作用于: 根位移 (retarget_to 的 scale_to_target_skeleton)
#   不作用于: 骨架尺寸 (由目标 bio.xml 的 SkeletonTree 自动决定)
# 坐标系转换顺序: BVH(y-up,cm) --scale--> BIO(y-up,m) --rot x+90--> BIO(z-up,m) --平移--> 脚贴地

source_length_scale: 0.060

# 源 -> 目标坐标旋转 (四元数 xyzw)
# 源(CMU)与目标(BIO)均为 y-up 且 T-pose 面朝 +z, 故为单位旋转
rotation_to_target_skeleton: [0.0, 0.0, 0.0, 1.0]

# 关节映射 {source: target} (CMU MotionBuilder 命名 -> BIO 命名)
# 未列出的目标关节 (如 FootPinkyL/R) 由 retarget_to 自动继承父关节旋转
joint_mapping:
  Hips: Pelvis
  Spine: Spine
  Spine1: Torso
  Neck: Neck
  Head: Head
  LeftShoulder: ShoulderL
  LeftArm: ArmL
  LeftForeArm: ForeArmL
  LeftHand: HandL
  RightShoulder: ShoulderR
  RightArm: ArmR
  RightForeArm: ForeArmR
  RightHand: HandR
  LeftUpLeg: FemurL
  LeftLeg: TibiaL
  LeftFoot: TalusL
  LeftToeBase: FootThumbL
  RightUpLeg: FemurR
  RightLeg: TibiaR
  RightFoot: TalusR
  RightToeBase: FootThumbR
